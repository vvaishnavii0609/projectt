# Not currently required by any test in this project (BankServiceTest, GatewayServiceTest,
# BankCallbackServiceTest, ChecksumUtilTest are all plain Mockito unit tests - no
# @SpringBootTest, no Spring context, no MySQL needed to run them). This file is here for
# the pre-existing HdfcNetBankingSimulatorApplicationTests context-load test and for
# anyone adding @SpringBootTest-based tests later, so they don't need a real MySQL
# instance running just to boot the Spring context.
#
# To actually use this, add the H2 dependency to pom.xml (test scope) and annotate the
# context-load test with @ActiveProfiles("test").
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
bank.callback-delay-millis=50
