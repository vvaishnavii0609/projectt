<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Processing Payment</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:0; }
        .container { width: 420px; margin: 80px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); text-align:center; }
        .icon { font-size: 48px; }
        h2 { margin: 12px 0 4px 0; }
        .sub { color:#666; margin-bottom: 20px; }
        .row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; text-align:left; font-size:14px; }
        button { width: 100%; padding: 12px; margin-top: 20px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; background:#111; color:#fff; display:none; }
        .spinner { display:inline-block; width:14px; height:14px; border:2px solid #d1d5db; border-top-color:#111; border-radius:50%; animation:spin .8s linear infinite; margin-right:8px; vertical-align:middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">&#8987;</div>
    <h2 id="title">Processing your payment&hellip;</h2>
    <div class="sub" id="subtitle"><span class="spinner"></span>Waiting for the bank to confirm this transaction</div>
    <div id="rows"></div>
    <button id="refreshBtn">Check Again</button>
</div>
<script>
    // This page ONLY ever shows an in-progress state. It never renders a final
    // SUCCESS/FAILURE result itself - once the transaction reaches a terminal
    // status (as confirmed by PG's own Bank-Verify reconciliation, not the raw
    // bank callback), this page hands off to receipt.html or payment-failed.html.
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');
    let pollCount = 0;
    const MAX_POLLS = 10; // ~20s auto-poll, covers the DELAY scenario comfortably

    function renderWaiting(t) {
        const subtitle = document.getElementById('subtitle');
        const rows = document.getElementById('rows');
        subtitle.innerHTML = '<span class="spinner"></span>Status: ' + (t ? t.status : 'PENDING');
        if (t) {
            rows.innerHTML =
                '<div class="row"><span>Order ID</span><span>' + t.orderId + '</span></div>' +
                '<div class="row"><span>Amount</span><span>' + t.currency + ' ' + t.amount + '</span></div>';
        }
    }

    async function checkStatus() {
        try {
            // Browser only ever talks to Merchant's own backend - never to the Gateway
            // or the Bank directly. Merchant is what actually calls PG's /gateway/status.
            const res = await fetch('/merchant/transaction/' + orderId);
            if (!res.ok) throw new Error('Could not reach payment gateway');
            const t = await res.json();

            if (t.status === 'SUCCESS') {
                window.location.href = '/receipt.html?orderId=' + encodeURIComponent(orderId);
                return;
            }
            if (t.status === 'FAILURE') {
                window.location.href = '/payment-failed.html?orderId=' + encodeURIComponent(orderId);
                return;
            }

            renderWaiting(t);
            if (pollCount < MAX_POLLS) {
                pollCount++;
                setTimeout(checkStatus, 2000);
            } else {
                document.getElementById('title').textContent = 'Still waiting on the bank\u2026';
                document.getElementById('subtitle').textContent = 'This is taking longer than usual.';
                document.getElementById('refreshBtn').style.display = 'block';
            }
        } catch (e) {
            document.getElementById('title').textContent = 'Error';
            document.getElementById('subtitle').textContent = e.message;
            document.getElementById('refreshBtn').style.display = 'block';
        }
    }

    document.getElementById('refreshBtn').addEventListener('click', () => {
        document.getElementById('refreshBtn').style.display = 'none';
        pollCount = 0;
        checkStatus();
    });
    checkStatus();
</script>
</body>
</html>
