<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — ABC Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="shell">
    <div class="topbar">
        <div class="wordmark"><span class="dot"></span>ABC Store</div>
        <span class="test-mode-badge">SIMULATOR</span>
    </div>

    <div class="stepper">
        <div class="step done"><div class="step-dot">&#10003;</div><div class="step-label">Order</div></div>
        <div class="step-line done"></div>
        <div class="step current"><div class="step-dot">2</div><div class="step-label">Pay</div></div>
        <div class="step-line"></div>
        <div class="step"><div class="step-dot">3</div><div class="step-label">Bank</div></div>
        <div class="step-line"></div>
        <div class="step"><div class="step-dot">4</div><div class="step-label">Confirm</div></div>
    </div>

    <div class="card">
        <h1>Checkout</h1>
        <div class="muted" style="margin-top:4px">Review your order and choose a payment method.</div>

        <div class="group-title">Order Summary</div>
        <div class="row"><span class="k">Product</span><span class="v" id="productName">Loading&hellip;</span></div>
        <div class="row"><span class="k">Order ID</span><span class="v" id="orderId">-</span></div>
        <div class="row"><span class="k">Amount</span><span class="v amount" id="amountDisplay">-</span></div>

        <div class="group-title">Payment Method</div>
        <label class="option-card">
            <input type="radio" name="paymentMethod" value="netbanking" checked>
            <span>Net Banking<span class="hint">Pay directly from your bank account</span></span>
        </label>

        <div class="group-title">Select Bank</div>
        <label class="option-card">
            <input type="radio" name="bankId" value="HDFC" checked>
            <span>HDFC Bank<span class="hint">NetBanking EPI integration</span></span>
        </label>

        <button class="btn-primary" id="payBtn" style="margin-top:22px">Pay</button>
        <div class="error-text" id="err"></div>
    </div>
</div>

<script>
    let currentOrder = null;

    async function loadOrder() {
        try {
            const res = await fetch('/merchant/order');
            if (!res.ok) throw new Error('Could not create order');
            currentOrder = await res.json();
            document.getElementById('productName').innerText = currentOrder.productName;
            document.getElementById('orderId').innerText = currentOrder.orderId;
            document.getElementById('amountDisplay').innerText = '₹' + currentOrder.amount;
            document.getElementById('payBtn').innerText = 'Pay ₹' + currentOrder.amount;
        } catch (e) {
            document.getElementById('err').textContent = e.message;
            document.getElementById('err').style.display = 'block';
        }
    }
    loadOrder();

    document.getElementById('payBtn').addEventListener('click', payNow);

    async function payNow() {
        const btn = document.getElementById('payBtn');
        const err = document.getElementById('err');
        if (!currentOrder) return;

        btn.disabled = true; btn.innerText = 'Redirecting to bank...'; err.style.display = 'none';

        const paymentRequest = {
            orderId: currentOrder.orderId,
            amount: String(currentOrder.amount),
            paymentMethod: document.querySelector('input[name=paymentMethod]:checked').value,
            bankId: document.querySelector('input[name=bankId]:checked').value
        };

        try {
            const response = await fetch('/gateway/payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(paymentRequest)
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Payment initiation failed');

            console.log("Gateway response:", data);
            window.location.href = data.redirectUrl;

        } catch (error) {
            console.error(error);
            err.textContent = error.message;
            err.style.display = 'block';
            btn.disabled = false; btn.innerText = 'Pay ₹' + currentOrder.amount;
        }
    }
</script>
</body>
</html>
