<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HDFC NetBanking - Select Test Scenario</title>
<style>
  body { font-family: Arial, sans-serif; background:#0f1115; color:#e6e6e6; margin:0; padding:40px 16px; }
  .card { max-width: 560px; margin: 0 auto; background:#1a1d24; border:1px solid #2a2e38; border-radius:12px; padding:28px 32px; }
  h1 { font-size:20px; margin:0 0 4px 0; color:#fff; }
  .sub { color:#9aa0ab; font-size:13px; margin-bottom:20px; }
  .row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #262a33; font-size:14px; }
  .row span:first-child { color:#9aa0ab; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; background:#004c8f; color:#fff; }
  .group-title { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#6b7280; margin:18px 0 8px 0; }
  .scenario { display:block; border:1px solid #2a2e38; border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .scenario:hover { border-color:#004c8f; }
  .scenario input { margin-right:10px; }
  .scenario .hint { display:block; color:#8b93a1; font-size:12px; margin-top:2px; margin-left:24px; }
  button { margin-top:20px; width:100%; padding:12px; border:none; border-radius:8px; background:#004c8f; color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
  button:hover { background:#00609e; }
  button:disabled { opacity:.6; cursor:default; }
  input[type=text] { width:100%; padding:8px; margin-top:6px; box-sizing:border-box; background:#0f1115; color:#fff; border:1px solid #2a2e38; border-radius:6px; }
  .error { color:#ff8080; font-size:13px; margin-top:10px; display:none; }
</style>
</head>
<body>
<div class="card">
  <span class="badge">HDFC BANK</span>
  <h1 style="margin-top:14px">NetBanking - Select Test Scenario</h1>
  <div class="sub">Simulated bank &middot; test/UAT environment, not a real bank</div>
  <div class="row"><span>Merchant</span><span id="merchantCode">-</span></div>
  <div class="row"><span>Reference No.</span><span id="merchantRefNo">-</span></div>
  <div class="row"><span>Amount to debit</span><span id="amount">-</span></div>

  <div class="group-title">Normal</div>
  <label class="scenario"><input type="radio" name="scenario" value="SUCCESS" checked> Success</label>
  <label class="scenario"><input type="radio" name="scenario" value="PENDING"> Pending</label>

  <div class="group-title">Business Failures</div>
  <label class="scenario"><input type="radio" name="scenario" value="FAILURE_INSUFFICIENT_FUNDS"> Insufficient Funds</label>
  <label class="scenario"><input type="radio" name="scenario" value="FAILURE_AUTH"> Authentication Failed</label>
  <label class="scenario"><input type="radio" name="scenario" value="FAILURE_ACCOUNT_BLOCKED"> Account Blocked</label>
  <label class="scenario"><input type="radio" name="scenario" value="FAILURE_INVALID_ACCOUNT"> Invalid / Non-eligible Account</label>
  <label class="scenario"><input type="radio" name="scenario" value="FAILURE_TXN_LIMIT_EXCEEDED"> Daily Limit Exceeded</label>

  <div class="group-title">Technical Failures</div>
  <label class="scenario"><input type="radio" name="scenario" value="FAILURE_BANK_ERROR"> Bank Internal Error</label>
  <label class="scenario"><input type="radio" name="scenario" value="FAILURE_BANK_MAINTENANCE"> Bank Under Maintenance</label>

  <div class="group-title">Session</div>
  <label class="scenario">
    <input type="radio" name="scenario" value="SESSION_TIMEOUT"> Session Timeout
    <span class="hint">Nothing processed at all - no redirect, no callback, customer must restart</span>
  </label>

  <div class="group-title">Communication Faults (fault injection)</div>
  <label class="scenario">
    <input type="radio" name="scenario" value="DELAY"> Delay then Success
    <span class="hint">Succeeds, but the backend callback fires late</span>
  </label>
  <label class="scenario">
    <input type="radio" name="scenario" value="DROP"> Drop Callback
    <span class="hint">Bank processes it as SUCCESS internally, but never calls PG back - only Verify recovers it</span>
  </label>
  <label class="scenario">
    <input type="radio" name="scenario" value="DUPLICATE"> Duplicate Callback
    <span class="hint">Succeeds, callback fires twice - PG must not double-process</span>
  </label>

  <div class="group-title">Data-Integrity Faults</div>
  <label class="scenario">
    <input type="radio" name="scenario" value="TAMPER_AMOUNT"> Amount Tampering
    <span class="hint">Reports a different amount with a self-consistent checksum</span>
  </label>
  <label class="scenario">
    <input type="radio" name="scenario" value="TAMPER_CHECKSUM"> Checksum Corruption
    <span class="hint">Sends a deliberately broken checksum</span>
  </label>

  <button id="submitBtn">Process Transaction</button>
  <div class="error" id="err"></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const merchantRefNo = params.get('merchantRefNo');
document.getElementById('merchantCode').textContent = params.get('merchantCode') || '-';
document.getElementById('merchantRefNo').textContent = merchantRefNo || '-';
document.getElementById('amount').textContent = (params.get('txnCurrency') || '') + ' ' + (params.get('txnAmount') || '');

document.getElementById('submitBtn').addEventListener('click', async () => {
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('err');
  const scenario = document.querySelector('input[name=scenario]:checked').value;
  btn.disabled = true; btn.textContent = 'Processing...'; err.style.display = 'none';

  const body = new URLSearchParams();
  body.set('merchantRefNo', merchantRefNo);
  body.set('scenario', scenario);

  try {
    const res = await fetch('/netbanking/authorize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString(),
      redirect: 'follow'
    });
    // AuthorizeController does a real 302 - the browser follows it automatically and
    // we land on receipt.html; res.url reflects the final landed-on page.
    if (res.redirected) {
      window.location.href = res.url;
    } else {
      const text = await res.text();
      err.textContent = text;
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Process Transaction';
    }
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Process Transaction';
  }
});
</script>
</body>
</html>
