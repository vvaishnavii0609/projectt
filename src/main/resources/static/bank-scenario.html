<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDFC NetBanking — Test Scenario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    .bank-mark { display: flex; align-items: center; gap: 10px; }
    .bank-mark .glyph {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--amber-500); color: #17130a;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-weight: 700; font-size: 15px;
    }
    .bank-mark .name { font-family: var(--font-display); font-weight: 700; font-size: 17px; }

    .cat-normal .option-card:hover { border-color: var(--green-600); }
    .cat-fail .option-card:hover { border-color: var(--red-600); }
    .cat-fault .option-card:hover { border-color: var(--amber-500); }
    .cat-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot-green { background: var(--green-600); }
    .dot-red { background: var(--red-600); }
    .dot-amber { background: var(--amber-500); }
  </style>
</head>
<body class="bank-theme">
<div class="shell">
  <div class="topbar">
    <div class="bank-mark"><div class="glyph">H</div><div class="name">HDFC Bank</div></div>
    <span class="test-mode-badge">TEST / UAT</span>
  </div>

  <div class="stepper">
    <div class="step done"><div class="step-dot">&#10003;</div><div class="step-label">Order</div></div>
    <div class="step-line done"></div>
    <div class="step done"><div class="step-dot">&#10003;</div><div class="step-label">Pay</div></div>
    <div class="step-line done"></div>
    <div class="step current"><div class="step-dot">3</div><div class="step-label">Bank</div></div>
    <div class="step-line"></div>
    <div class="step"><div class="step-dot">4</div><div class="step-label">Confirm</div></div>
  </div>

  <div class="card">
    <h1>Select Test Scenario</h1>
    <div class="muted" style="margin-top:4px">Choose how the bank should respond to this transaction.</div>

    <div class="row" style="margin-top:16px"><span class="k">Merchant</span><span class="v" id="merchantCode">-</span></div>
    <div class="row"><span class="k">Reference No.</span><span class="v" id="merchantRefNo">-</span></div>
    <div class="row"><span class="k">Amount to debit</span><span class="v amount" id="amount">-</span></div>

    <div class="group-title"><span class="cat-dot dot-green"></span>Normal</div>
    <div class="cat-normal">
      <label class="option-card"><input type="radio" name="scenario" value="SUCCESS" checked><span>Success</span></label>
      <label class="option-card"><input type="radio" name="scenario" value="PENDING"><span>Pending</span></label>
    </div>

    <div class="group-title"><span class="cat-dot dot-red"></span>Business Failures</div>
    <div class="cat-fail">
      <label class="option-card"><input type="radio" name="scenario" value="FAILURE_INSUFFICIENT_FUNDS"><span>Insufficient Funds</span></label>
      <label class="option-card"><input type="radio" name="scenario" value="FAILURE_AUTH"><span>Authentication Failed</span></label>
      <label class="option-card"><input type="radio" name="scenario" value="FAILURE_ACCOUNT_BLOCKED"><span>Account Blocked</span></label>
      <label class="option-card"><input type="radio" name="scenario" value="FAILURE_INVALID_ACCOUNT"><span>Invalid / Non-eligible Account</span></label>
      <label class="option-card"><input type="radio" name="scenario" value="FAILURE_TXN_LIMIT_EXCEEDED"><span>Daily Limit Exceeded</span></label>
    </div>

    <div class="group-title"><span class="cat-dot dot-red"></span>Technical Failures</div>
    <div class="cat-fail">
      <label class="option-card"><input type="radio" name="scenario" value="FAILURE_BANK_ERROR"><span>Bank Internal Error</span></label>
      <label class="option-card"><input type="radio" name="scenario" value="FAILURE_BANK_MAINTENANCE"><span>Bank Under Maintenance</span></label>
    </div>

    <div class="group-title"><span class="cat-dot dot-amber"></span>Session</div>
    <div class="cat-fault">
      <label class="option-card">
        <input type="radio" name="scenario" value="SESSION_TIMEOUT">
        <span>Session Timeout<span class="hint">Nothing processed at all - no redirect, no callback</span></span>
      </label>
    </div>

    <div class="group-title"><span class="cat-dot dot-amber"></span>Communication Faults (fault injection)</div>
    <div class="cat-fault">
      <label class="option-card">
        <input type="radio" name="scenario" value="DELAY">
        <span>Delay then Pending<span class="hint">Bank takes too long to respond - stays PENDING, no automatic resolution</span></span>
      </label>
      <label class="option-card">
        <input type="radio" name="scenario" value="DROP">
        <span>Drop Callback<span class="hint">No callback is ever sent - stays PENDING until manually verified</span></span>
      </label>
      <label class="option-card">
        <input type="radio" name="scenario" value="DUPLICATE">
        <span>Duplicate Callback<span class="hint">Succeeds, callback fires twice - PG must not double-process</span></span>
      </label>
    </div>

    <div class="group-title"><span class="cat-dot dot-amber"></span>Data-Integrity Faults</div>
    <div class="cat-fault">
      <label class="option-card">
        <input type="radio" name="scenario" value="TAMPER_AMOUNT">
        <span>Amount Tampering<span class="hint">Reports a different amount with a self-consistent checksum</span></span>
      </label>
      <label class="option-card">
        <input type="radio" name="scenario" value="TAMPER_CHECKSUM">
        <span>Checksum Corruption<span class="hint">Sends a deliberately broken checksum</span></span>
      </label>
    </div>

    <button class="btn-primary" id="submitBtn" style="margin-top:20px">Process Transaction</button>
    <div class="error-text" id="err"></div>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const merchantRefNo = params.get('merchantRefNo');
  document.getElementById('merchantCode').textContent = params.get('merchantCode') || '-';
  document.getElementById('merchantRefNo').textContent = merchantRefNo || '-';
  document.getElementById('amount').textContent = (params.get('txnCurrency') || '') + ' ' + (params.get('txnAmount') || '');

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('err');
    const scenario = document.querySelector('input[name=scenario]:checked').value;
    btn.disabled = true; btn.textContent = 'Processing...'; err.style.display = 'none';

    const body = new URLSearchParams();
    body.set('merchantRefNo', merchantRefNo);
    body.set('scenario', scenario);

    try {
      const res = await fetch('/netbanking/authorize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString(),
        redirect: 'follow'
      });
      if (res.redirected) {
        window.location.href = res.url;
      } else {
        const text = await res.text();
        err.textContent = text;
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Process Transaction';
      }
    } catch (e) {
      err.textContent = e.message;
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Process Transaction';
    }
  });
</script>
</body>
</html>
