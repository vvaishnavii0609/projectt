<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Successful</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:0; }
    .container { width: 420px; margin: 80px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); text-align:center; }
    .icon { font-size: 48px; }
    h2 { margin: 12px 0 4px 0; }
    .sub { color:#666; margin-bottom: 20px; }
    .row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; text-align:left; font-size:14px; }
    button { width: 100%; padding: 12px; margin-top: 20px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; background:#111; color:#fff; }
  </style>
</head>
<body>
<div class="container">
  <div class="icon">&#9989;</div>
  <h2>Payment Successful</h2>
  <div class="sub" id="subtitle">Loading receipt&hellip;</div>
  <div id="rows"></div>
  <button onclick="window.location.href='/merchant.html'">Back to Shop</button>
</div>
<script>
  // This page is only ever reached AFTER payment-processing.html has already
  // confirmed a terminal SUCCESS via the PG's Bank-Verify reconciliation.
  // It does one confirming fetch and renders - no polling, no spinner here.
  // If, for any reason, the transaction isn't actually SUCCESS yet (e.g. a
  // bookmarked/refreshed link), it hands control back to the processing page
  // rather than showing a receipt for a payment that isn't confirmed.
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('orderId');

  async function loadReceipt() {
    try {
      const res = await fetch('/merchant/transaction/' + orderId);
      if (!res.ok) throw new Error('Could not reach payment gateway');
      const t = await res.json();

      if (t.status !== 'SUCCESS') {
        window.location.href = '/payment-processing.html?orderId=' + encodeURIComponent(orderId);
        return;
      }

      document.getElementById('subtitle').textContent = 'Your payment has been confirmed';
      document.getElementById('rows').innerHTML =
              '<div class="row"><span>Order ID</span><span>' + t.orderId + '</span></div>' +
              '<div class="row"><span>Transaction ID</span><span>' + (t.transactionId || '-') + '</span></div>' +
              '<div class="row"><span>Bank Ref No</span><span>' + (t.bankRefNo || '-') + '</span></div>' +
              '<div class="row"><span>Amount</span><span>' + t.currency + ' ' + t.amount + '</span></div>' +
              '<div class="row"><span>Receipt</span><span>' + (t.receipt || '-') + '</span></div>';
    } catch (e) {
      document.getElementById('subtitle').textContent = e.message;
    }
  }

  loadReceipt();
</script>
</body>
</html>
