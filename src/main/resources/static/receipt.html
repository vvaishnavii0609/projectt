<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — ABC Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    .status-icon { font-size: 42px; text-align: center; margin-bottom: 6px; }
    .status-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; text-align: center; }
    .status-sub { text-align: center; color: var(--text-600); font-size: 13.5px; margin: 4px 0 20px; }

    /* Ticket-stub receipt: dashed tear line with circular notches cut into the sides */
    .receipt {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .receipt-body { padding: 20px 24px; }
    .tear {
      position: relative;
      height: 0;
      border-top: 2px dashed var(--border);
      margin: 4px 0;
    }
    .tear::before, .tear::after {
      content: "";
      position: absolute;
      top: -11px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--bg);
    }
    .tear::before { left: -11px; }
    .tear::after { right: -11px; }
    .receipt-footer { padding: 16px 24px 20px; }

    .receipt-id { font-family: var(--font-mono); font-size: 13px; letter-spacing: .02em; text-align: center; color: var(--text-600); margin-top: 8px; }
  </style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="wordmark"><span class="dot"></span>ABC Store</div>
    <span class="test-mode-badge">SIMULATOR</span>
  </div>

  <div class="stepper">
    <div class="step done"><div class="step-dot">&#10003;</div><div class="step-label">Order</div></div>
    <div class="step-line done"></div>
    <div class="step done"><div class="step-dot">&#10003;</div><div class="step-label">Pay</div></div>
    <div class="step-line done"></div>
    <div class="step done"><div class="step-dot">&#10003;</div><div class="step-label">Bank</div></div>
    <div class="step-line done"></div>
    <div class="step done"><div class="step-dot">&#10003;</div><div class="step-label">Confirm</div></div>
  </div>

  <div class="status-icon">&#9989;</div>
  <div class="status-title">Payment Successful</div>
  <div class="status-sub" id="subtitle">Loading receipt&hellip;</div>

  <div class="receipt">
    <div class="receipt-body">
      <div class="group-title" style="margin-top:0">Order Details</div>
      <div id="rows"></div>
    </div>
    <div class="tear"></div>
    <div class="receipt-footer">
      <div class="row"><span class="k">Transaction ID</span><span class="v" id="transactionId">-</span></div>
      <div class="row"><span class="k">Receipt No.</span><span class="v" id="receiptNo">-</span></div>
    </div>
  </div>

  <button class="btn-primary" onclick="window.location.href='/merchant.html'">Back to Shop</button>
</div>

<script>
  // This page is only ever reached AFTER payment-processing.html has already
  // confirmed a terminal SUCCESS via the PG's Bank-Verify reconciliation.
  // One confirming fetch, no polling, no refresh button - if it's ever loaded
  // before SUCCESS is actually confirmed, it hands control back to the
  // processing page instead of showing a receipt for an unconfirmed payment.
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('orderId');

  async function loadReceipt() {
    try {
      const res = await fetch('/merchant/transaction/' + orderId);
      if (!res.ok) throw new Error('Could not reach payment gateway');
      const t = await res.json();

      if (t.status !== 'SUCCESS') {
        window.location.href = '/payment-processing.html?orderId=' + encodeURIComponent(orderId);
        return;
      }

      document.getElementById('subtitle').innerHTML =
              '<span class="badge badge-success">Bank Ref: ' + (t.bankRefNo || '-') + '</span>';

      document.getElementById('rows').innerHTML =
              '<div class="row"><span class="k">Order ID</span><span class="v">' + t.orderId + '</span></div>' +
              '<div class="row"><span class="k">Amount</span><span class="v amount">' + t.currency + ' ' + t.amount + '</span></div>';

      document.getElementById('transactionId').textContent = t.transactionId || '-';
      document.getElementById('receiptNo').textContent = t.receipt || '-';
    } catch (e) {
      document.getElementById('subtitle').textContent = e.message;
    }
  }

  loadReceipt();
</script>
</body>
</html>
